name: SteelEngine
options:
  bundleIdPrefix: ai.steelenginefoundation
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO

packages:
  SteelEngineKit:
    path: ../shared/SteelEngineKit
  Swabble:
    path: ../swabble
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 147.0.0

schemes:
  SteelEngine:
    shared: true
    build:
      targets:
        SteelEngine: all
    test:
      targets:
        - SteelEngineTests
        - SteelEngineLogicTests
  SteelEngineLogicTests:
    shared: true
    build:
      targets:
        SteelEngineLogicTests: all
    test:
      targets:
        - SteelEngineLogicTests
  SteelEngineUITests:
    shared: true
    build:
      targets:
        SteelEngineUITests: all
    test:
      targets:
        - SteelEngineUITests
  SteelEngineWatchApp:
    shared: true
    build:
      targets:
        SteelEngineWatchApp: all

targets:
  SteelEngine:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
      - path: Sources/Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - target: SteelEngineShareExtension
        embed: true
      - target: SteelEngineActivityWidget
        embed: true
      # A companion watch application belongs in the standard Watch bundle location.
      # PlugIns is for extension products and breaks paired watch installation.
      - target: SteelEngineWatchApp
      - package: SteelEngineKit
      - package: SteelEngineKit
        product: SteelEngineChatUI
      - package: SteelEngineKit
        product: SteelEngineProtocol
      - package: Swabble
        product: SwabbleKit
      - package: WebRTC
      - sdk: AppIntents.framework
      - sdk: HealthKit.framework
    preBuildScripts:
      - name: SwiftFormat (lint)
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          "$SRCROOT/../../scripts/check-swift-tools.sh" swiftformat
          swiftformat --lint --config "$SRCROOT/../../config/swiftformat" \
            --unexclude "$SRCROOT/Sources,$SRCROOT/ShareExtension,$SRCROOT/ActivityWidget,$SRCROOT/WatchApp,$SRCROOT/../shared/SteelEngineKit/Sources/SteelEngineChatUI,$SRCROOT/../shared/SteelEngineKit/Sources/SteelEngineKit,$SRCROOT/../shared/SteelEngineKit/Sources/SteelEngineProtocol,$SRCROOT/../swabble/Sources/SwabbleKit" \
            --filelist "$SRCROOT/SwiftSources.input.xcfilelist"
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          "$SRCROOT/../../scripts/check-swift-tools.sh" swiftlint
          swiftlint lint --strict --config "$SRCROOT/.swiftlint.yml" --use-script-input-file-lists
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "$(STEELENGINE_CODE_SIGN_IDENTITY)"
        CODE_SIGN_ENTITLEMENTS: "$(STEELENGINE_CODE_SIGN_ENTITLEMENTS)"
        CODE_SIGN_STYLE: "$(STEELENGINE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(STEELENGINE_DEVELOPMENT_TEAM)"
        STEELENGINE_ACTIVE_APP_GROUP_ID: "$(STEELENGINE_APP_GROUP_ID)"
        STEELENGINE_APP_DISPLAY_NAME: SteelEngine
        STEELENGINE_URL_SCHEME: steelengine
        PRODUCT_BUNDLE_IDENTIFIER: "$(STEELENGINE_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(STEELENGINE_APP_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDebug
          CODE_SIGN_STYLE: Automatic
          STEELENGINE_ACTIVE_APP_GROUP_ID: "$(STEELENGINE_DEBUG_APP_GROUP_ID)"
          STEELENGINE_APP_DISPLAY_NAME: SteelEngine
          STEELENGINE_CODE_SIGN_ENTITLEMENTS: Sources/SteelEngine.entitlements
          STEELENGINE_APNS_ENTITLEMENT_ENVIRONMENT: development
          STEELENGINE_URL_SCHEME: steelengine-debug
          PRODUCT_BUNDLE_IDENTIFIER: "$(STEELENGINE_DEBUG_APP_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
          STEELENGINE_PUSH_MODE: localSandbox
          STEELENGINE_PUSH_RELAY_BASE_URL: ""
        Release:
          STEELENGINE_CODE_SIGN_ENTITLEMENTS: Sources/SteelEngine.entitlements
          STEELENGINE_APNS_ENTITLEMENT_ENVIRONMENT: production
          STEELENGINE_PUSH_MODE: localProduction
          STEELENGINE_PUSH_RELAY_BASE_URL: ""
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "$(STEELENGINE_APP_DISPLAY_NAME)"
        CFBundleIconName: "$(ASSETCATALOG_COMPILER_APPICON_NAME)"
        CFBundleURLTypes:
          - CFBundleURLName: ai.steelenginefoundation.app
            CFBundleURLSchemes:
              - "$(STEELENGINE_URL_SCHEME)"
        CFBundleShortVersionString: "$(STEELENGINE_MARKETING_VERSION)"
        SteelEngineCanonicalVersion: "$(STEELENGINE_IOS_VERSION)"
        SteelEngineGitCommit: "$(STEELENGINE_GIT_COMMIT)"
        SteelEngineBuildTimestamp: "$(STEELENGINE_BUILD_TIMESTAMP)"
        SteelEngineAppGroupIdentifier: "$(STEELENGINE_ACTIVE_APP_GROUP_ID)"
        CFBundleVersion: "$(STEELENGINE_BUILD_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - location
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - "$(PRODUCT_BUNDLE_IDENTIFIER).bgrefresh"
        NSLocalNetworkUsageDescription: SteelEngine discovers and connects to your SteelEngine gateway on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _steelengine-gw._tcp
        NSCameraUsageDescription: SteelEngine uses the camera when you scan a Gateway setup QR code or ask your paired Gateway or assistant to capture a photo or short video from this iPhone, for example to connect to your Gateway or show your assistant a document, device screen, or workspace.
        NSCalendarsUsageDescription: SteelEngine uses your calendars to show events and scheduling context when you enable calendar access.
        NSCalendarsFullAccessUsageDescription: SteelEngine uses your calendars to show events and scheduling context when you enable calendar access.
        NSCalendarsWriteOnlyAccessUsageDescription: SteelEngine uses your calendars to add events when you enable calendar access.
        NSContactsUsageDescription: SteelEngine uses your contacts so you can search and reference people while using the assistant.
        NSLocationWhenInUseUsageDescription: SteelEngine uses your location when you allow location sharing.
        NSLocationAlwaysAndWhenInUseUsageDescription: SteelEngine can share your location in the background when you enable Always.
        NSMicrophoneUsageDescription: SteelEngine uses the microphone for realtime chat, voice wake, push-to-talk, and voice notes.
        NSMotionUsageDescription: SteelEngine may use motion data to support device-aware interactions and automations.
        NSHealthShareUsageDescription: SteelEngine reads your steps, sleep, resting heart rate, and workouts from the Apple Health app to create summaries you request and send them through your Gateway to your configured AI provider.
        NSHealthUpdateUsageDescription: SteelEngine does not write to the Apple Health app. It uses read-only data to create summaries you request and send them through your Gateway to your configured AI provider.
        NSPhotoLibraryUsageDescription: SteelEngine lets your assistant read photos you allow and lets you choose photos to share.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        NSRemindersFullAccessUsageDescription: SteelEngine uses your reminders to list, add, and complete tasks when you enable reminders access.
        NSSpeechRecognitionUsageDescription: SteelEngine uses on-device speech recognition for talk mode and voice wake.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - RedHatDisplay[wght].ttf
          - Inter[opsz,wght].ttf
          - Inter-Italic[opsz,wght].ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
        SteelEnginePushMode: "$(STEELENGINE_PUSH_MODE)"
        SteelEnginePushRelayBaseURL: "$(STEELENGINE_PUSH_RELAY_BASE_URL)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  SteelEngineShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ShareExtension
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: SteelEngineKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(STEELENGINE_CODE_SIGN_IDENTITY)"
        CODE_SIGN_ENTITLEMENTS: ShareExtension/SteelEngineShareExtension.entitlements
        CODE_SIGN_STYLE: "$(STEELENGINE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(STEELENGINE_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        STEELENGINE_ACTIVE_APP_GROUP_ID: "$(STEELENGINE_APP_GROUP_ID)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(STEELENGINE_SHARE_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(STEELENGINE_SHARE_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          STEELENGINE_ACTIVE_APP_GROUP_ID: "$(STEELENGINE_DEBUG_APP_GROUP_ID)"
          PRODUCT_BUNDLE_IDENTIFIER: "$(STEELENGINE_DEBUG_SHARE_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: SteelEngine Share
        CFBundleShortVersionString: "$(STEELENGINE_MARKETING_VERSION)"
        SteelEngineAppGroupIdentifier: "$(STEELENGINE_ACTIVE_APP_GROUP_ID)"
        CFBundleVersion: "$(STEELENGINE_BUILD_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1

  SteelEngineActivityWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ActivityWidget
      - path: Sources/LiveActivity/SteelEngineActivityAttributes.swift
      - path: Sources/Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(STEELENGINE_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(STEELENGINE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(STEELENGINE_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(STEELENGINE_ACTIVITY_WIDGET_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(STEELENGINE_ACTIVITY_WIDGET_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          PRODUCT_BUNDLE_IDENTIFIER: "$(STEELENGINE_DEBUG_ACTIVITY_WIDGET_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: ActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: SteelEngine Activity
        CFBundleShortVersionString: "$(STEELENGINE_MARKETING_VERSION)"
        CFBundleVersion: "$(STEELENGINE_BUILD_VERSION)"
        NSSupportsLiveActivities: true
        UIAppFonts:
          - RedHatDisplay[wght].ttf
          - Inter[opsz,wght].ttf
          - Inter-Italic[opsz,wght].ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  SteelEngineWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
        excludes:
          - Info.plist
      - path: Sources/Services/WatchSessionActivationGate.swift
        group: Sources/Services
      - path: Sources/Services/ExactOpaqueIdentifier.swift
        group: Sources/Services
      # Universal talk waveform, compiled directly to keep the watch styling local.
      - path: ../shared/SteelEngineKit/Sources/SteelEngineChatUI/TalkWaveformView.swift
        group: Shared
      # Universal mascot, compiled directly to keep the watch styling local.
      - path: ../shared/SteelEngineKit/Sources/SteelEngineChatUI/SteelEngineMascotView.swift
        group: Shared
      - path: ../shared/SteelEngineKit/Sources/SteelEngineChatUI/SteelEngineMascotAnimator.swift
        group: Shared
      - path: ../shared/SteelEngineKit/Sources/SteelEngineChatUI/SteelEngineMascotCanvas+Accessories.swift
        group: Shared
      - path: ../shared/SteelEngineKit/Sources/SteelEngineChatUI/ChatTypography.swift
        group: Shared
      - path: Sources/Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: SteelEngineKit
        product: SteelEngineKit
      - sdk: AppIntents.framework
      - sdk: AVFAudio.framework
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    attributes:
      DevelopmentTeam: "$(STEELENGINE_DEVELOPMENT_TEAM)"
      ProvisioningStyle: "$(STEELENGINE_CODE_SIGN_STYLE)"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "$(STEELENGINE_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(STEELENGINE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(STEELENGINE_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        STEELENGINE_COMPANION_APP_BUNDLE_ID: "$(STEELENGINE_APP_BUNDLE_ID)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(STEELENGINE_WATCH_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(STEELENGINE_WATCH_APP_PROFILE)"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDebug
          CODE_SIGN_STYLE: Automatic
          STEELENGINE_COMPANION_APP_BUNDLE_ID: "$(STEELENGINE_DEBUG_APP_BUNDLE_ID)"
          PRODUCT_BUNDLE_IDENTIFIER: "$(STEELENGINE_DEBUG_WATCH_APP_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: SteelEngine
        CFBundleShortVersionString: "$(STEELENGINE_MARKETING_VERSION)"
        CFBundleVersion: "$(STEELENGINE_BUILD_VERSION)"
        WKCompanionAppBundleIdentifier: "$(STEELENGINE_COMPANION_APP_BUNDLE_ID)"
        WKApplication: true
        WKPrefersNetworkUponForeground: true
        NSLocalNetworkUsageDescription: SteelEngine connects this Apple Watch directly to your Gateway on trusted local networks.
        UIAppFonts:
          - RedHatDisplay[wght].ttf
          - Inter[opsz,wght].ttf
          - Inter-Italic[opsz,wght].ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf

  SteelEngineTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests
        excludes:
          - Logic
      - path: WatchApp/Sources/WatchDeferredPayloadOrdering.swift
        group: WatchApp/Sources
    dependencies:
      - target: SteelEngine
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(STEELENGINE_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(STEELENGINE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(STEELENGINE_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(STEELENGINE_APP_BUNDLE_ID).tests"
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SteelEngine.app/SteelEngine"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "$(STEELENGINE_DEBUG_APP_BUNDLE_ID).tests"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: SteelEngineTests
        CFBundleShortVersionString: "$(STEELENGINE_MARKETING_VERSION)"
        CFBundleVersion: "$(STEELENGINE_BUILD_VERSION)"

  SteelEngineLogicTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests/Logic
      - path: ShareExtension/ShareDraftComposer.swift
        group: ShareExtension
      - path: ShareExtension/ShareComposeState.swift
        group: ShareExtension
      - path: ShareExtension/ShareAttachmentSummary.swift
        group: ShareExtension
      - path: WatchApp/Sources/WatchVoiceTurnTracker.swift
        group: WatchApp/Sources
      - path: WatchApp/Sources/WatchInboxMessages.swift
        group: WatchApp/Sources
      - path: WatchApp/Sources/WatchMascot.swift
        group: WatchApp/Sources
      - path: ../shared/SteelEngineKit/Sources/SteelEngineChatUI/SteelEngineMascotView.swift
        group: Shared
      - path: ../shared/SteelEngineKit/Sources/SteelEngineChatUI/SteelEngineMascotAnimator.swift
        group: Shared
      - path: ../shared/SteelEngineKit/Sources/SteelEngineChatUI/SteelEngineMascotCanvas+Accessories.swift
        group: Shared
      - path: ../shared/SteelEngineKit/Sources/SteelEngineChatUI/ChatTypography.swift
        group: Shared
      - path: Sources/Services/ExactOpaqueIdentifier.swift
        group: Sources/Services
    dependencies:
      - package: SteelEngineKit
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(STEELENGINE_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(STEELENGINE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(STEELENGINE_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(STEELENGINE_APP_BUNDLE_ID).logic-tests"
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_EMIT_CONST_VALUE_PROTOCOLS: ""
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "$(STEELENGINE_DEBUG_APP_BUNDLE_ID).logic-tests"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: SteelEngineLogicTests
        CFBundleShortVersionString: "$(STEELENGINE_MARKETING_VERSION)"
        CFBundleVersion: "$(STEELENGINE_BUILD_VERSION)"

  SteelEngineUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: UITests
    dependencies:
      - target: SteelEngine
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(STEELENGINE_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(STEELENGINE_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(STEELENGINE_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(STEELENGINE_APP_BUNDLE_ID).ui-tests"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TEST_TARGET_NAME: SteelEngine
        SWIFT_VERSION: "5.0"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "$(STEELENGINE_DEBUG_APP_BUNDLE_ID).ui-tests"
    info:
      path: UITests/Info.plist
      properties:
        CFBundleDisplayName: SteelEngineUITests
        CFBundleShortVersionString: "$(STEELENGINE_MARKETING_VERSION)"
        CFBundleVersion: "$(STEELENGINE_BUILD_VERSION)"

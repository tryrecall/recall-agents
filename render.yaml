services:
  - type: web
    name: steelengine
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: STEELENGINE_GATEWAY_PORT
        value: "8080"
      - key: STEELENGINE_STATE_DIR
        value: /data/.steelengine
      - key: STEELENGINE_WORKSPACE_DIR
        value: /data/workspace
      - key: STEELENGINE_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: steelengine-data
      mountPath: /data
      sizeGB: 1
